name: madres_digitales_flutter_new
description: Aplicación Madres Digitales - Nueva arquitectura limpia con Flutter y Riverpod
version: 1.0.0

environment:
  flutter: ">=3.10.0"
  sdk: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  flutter_secure_storage: ^8.0.0
  dio: ^5.3.0
  http: ^1.1.0
  json_annotation: ^4.8.0
  equatable: ^2.0.5
  go_router: ^12.1.0
  cached_network_image: ^3.2.3
  connectivity_plus: ^5.0.1
  image_picker: ^1.0.4
  intl: ^0.18.1
  uuid: ^4.5.1
  path_provider: ^2.0.15
  path: ^1.8.3
  sqflite: ^2.3.0
  shared_preferences: ^2.2.0
  share_plus: ^7.2.1
  url_launcher: ^6.1.12
  permission_handler: ^11.0.1
  flutter_local_notifications: ^19.5.0
  firebase_core: ^2.15.0
  firebase_crashlytics: ^3.4.0
  firebase_analytics: ^10.4.0
  # firebase_messaging: ^14.7.10
  google_fonts: ^5.1.0
  flutter_svg: ^2.0.7
  cupertino_icons: ^1.0.5
  shimmer: ^3.0.0
  lottie: ^2.3.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  freezed_annotation: ^2.4.0
  freezed: ^2.4.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  dartz: ^0.10.1
  retrofit: ^4.0.0
  chopper: ^7.0.0
  get_it: ^7.6.0
  mockito: ^5.4.0
  test: ^1.24.3
  # Dependencias multimedia
  audioplayers: ^5.2.1
  video_player: ^2.8.1
  chewie: ^1.7.4
  camera: ^0.11.0
  # Dependencias de ubicación
  geolocator: ^10.1.0
  # Dependencias de archivos
  # Dependencias de archivos
  file_picker: ^10.3.6
  # Dependencias de gráficos
  fl_chart: ^0.65.0
  # Dependencias de almacenamiento
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Dependencias de red
  socket_io_client: ^2.0.3+1
  # Dependencias web
  universal_html: ^2.2.4

dependency_overrides:

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Medium.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#ffffff"
    theme_color: "#4CAF50"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
  macos:
    generate: true
    image_path: "assets/images/logo.png"
