<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="madres_digitales_flutter_new">
  <link rel="apple-touch-icon" href="/icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png"/>

  <!-- Preload Material Icons from Google Fonts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Override Flutter's font loading to use CDN -->
  <style>
    /* Force Material Icons from Google CDN */
    @font-face {
      font-family: 'MaterialIcons';
      font-style: normal;
      font-weight: 400;
      src: url(https://fonts.gstatic.com/s/materialicons/v140/flUhRq6tzZclQEJ-Vdg-IuiaDsNc.woff2) format('woff2');
    }
    
    /* Prevent Flutter from trying to load local fonts */
    @font-face {
      font-family: 'MaterialIcons';
      src: url(https://fonts.gstatic.com/s/materialicons/v140/flUhRq6tzZclQEJ-Vdg-IuiaDsNc.woff2) format('woff2');
      font-display: swap;
    }
    
    /* Material Icons class */
    .material-icons {
      font-family: 'MaterialIcons' !important;
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
    
    /* Hide font loading errors */
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>

  <title>Madres Digitales</title>
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <script>
    // Intercept font loading errors and redirect to CDN
    window.addEventListener('error', function(e) {
      if (e.target.tagName === 'LINK' && e.target.href.includes('MaterialIcons')) {
        console.log('Redirecting MaterialIcons to CDN');
        e.target.href = 'https://fonts.googleapis.com/icon?family=Material+Icons';
      }
    }, true);
    
    // Configure Flutter to use CanvasKit from CDN
    window.flutterConfiguration = {
      canvasKitBaseUrl: "https://www.gstatic.com/flutter-canvaskit/"
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
